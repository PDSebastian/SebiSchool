services:
  mysql-server:
    image: mysql:8.4
    container_name: mysql_server2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sebi_school_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  sebionlineschool-app:
    image:  sebi123q/online-school-cloud-api:sha-3cf100d
    container_name: online-school-spring-api
    ports:
      - "8084:8083"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/sebi_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data: