spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sebi_school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    naming:
      physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  error:
    include-stacktrace: never

application:
  jwt:
    tokenPrefix: "Bearer"
    tokenExpirationAfterDays: 7
    # JWT_SECRET_KEY trebuie obligatoriu setat in prod (env var).
    # Default-ul de mai jos e DOAR pentru dev local.
    secretKey: ${JWT_SECRET_KEY:asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF}